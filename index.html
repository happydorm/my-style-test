<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eef9ff" />
  <title>내가 행복기숙사에 산다면 어떤 스타일일까?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="app">
  <section id="home" class="screen home-screen">
    <div class="cover-card">
      <img src="main-poster.png" alt="내가 행복기숙사에 산다면 어떤 스타일일까? 테스트 메인 포스터" class="main-poster" />
      <div class="home-bottom">
        <p class="mini-copy">내 생활습관으로 알아보는 나의 기숙사 생활 스타일!</p>
        <button id="startBtn" class="primary-btn">테스트 시작하기 <span>›</span></button>
        <p class="small-note">총 8문항 · 약 1분</p>
      </div>
    </div>
  </section>

  <section id="quiz" class="screen quiz-screen hidden">
    <header class="quiz-header">
      <button id="backBtn" class="icon-btn" aria-label="이전 질문">←</button>
      <div class="progress-wrap">
        <div class="progress-top">
          <span>기숙사 생활 스타일 테스트</span>
          <strong><span id="currentNum">1</span> / 8</strong>
        </div>
        <div class="progress-dots" id="progressDots"></div>
      </div>
    </header>

    <div class="quiz-content">
      <div class="question-card">
        <div class="question-heading">
          <div class="question-number"><span>Q.</span><b id="questionNum">01</b></div>
          <span class="question-label">MY DORM LIFE</span>
        </div>
        <h1 id="questionText"></h1>
        <p class="question-help">가장 나다운 답변을 골라주세요!</p>
      </div>

      <div class="answer-title">
        <span>나의 선택</span>
        <i>하나만 골라주세요</i>
      </div>
      <div id="answers" class="answers"></div>
    </div>
  </section>

  <section id="loading" class="screen loading-screen hidden">
    <div class="loading-card">
      <div class="cute-loader"></div>
      <p class="eyebrow">MY DORM STYLE</p>
      <h1>당신의 기숙사 생활 스타일을<br />살펴보고 있어요.</h1>
      <p>답변을 바탕으로 생활 스타일을 정리하는 중이에요!</p>
    </div>
  </section>

  <section id="result" class="screen result-screen hidden">
    <div class="result-card">
      <div class="result-top"><span class="result-label">MY DORM STYLE</span><span class="sparkle">✦</span></div>
      <div id="resultIcon" class="result-icon" aria-label="결과 꿈별이"></div>
      <p class="result-kicker">당신의 행복기숙사 생활 스타일은</p>
      <h1 id="resultTitle"></h1>
      <p id="resultTagline" class="result-tagline"></p>
      <div id="resultDescription" class="result-description"></div>
      <div class="result-box"><div class="result-box-title">이런 생활을 좋아해요</div><ul id="resultPoints"></ul></div>
      <button id="retryBtn" class="primary-btn">다시 테스트하기 <span>↻</span></button>
    </div>
    <p class="footer-copy">행복기숙사와 함께 나에게 맞는 생활을 찾아보세요 💙</p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
