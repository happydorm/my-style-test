<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내가 행복기숙사에 산다면 어떤 스타일일까?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--blue:#1689e8;--navy:#244b63;--sky:#eef9ff;--line:#d9eaf3;--muted:#91a6b3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Noto Sans KR',sans-serif;color:var(--navy)}
body{background:linear-gradient(180deg,#eef9ff 0%,#f8fcff 70%,#fff9ed 100%)}
button{font:inherit}.hidden{display:none!important}.screen{min-height:100vh}
/* home */
.home{display:flex;justify-content:center;padding:18px 14px 35px}.home-card{width:min(100%,560px);background:#fff;border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 18px 45px #2a70971f}.poster{display:block;width:100%;height:auto}.home-bottom{padding:20px 22px 24px;text-align:center}.home-copy{margin:0 0 13px;color:#6c8999;font-size:12px;font-weight:700}.start{width:100%;border:0;border-radius:17px;background:var(--blue);color:#fff;padding:16px;font-weight:800;font-size:16px;box-shadow:0 5px 0 #086fc2;cursor:pointer}.start:active{transform:translateY(3px);box-shadow:0 2px 0 #086fc2}.note{margin:11px 0 0;color:#a4b2ba;font-size:10px}
/* quiz */
.quiz{padding-bottom:40px}.header{width:min(calc(100% - 30px),720px);margin:auto;padding:18px 0 0;display:flex;gap:11px;align-items:center}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#6e8998;cursor:pointer;font-size:19px}.progress{flex:1}.progress-top{display:flex;justify-content:space-between;margin-bottom:8px;color:#78919f;font-size:10px;font-weight:600}.progress-top b{color:var(--blue)}.bars{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.bars i{height:7px;border-radius:999px;background:#dcecf4}.bars i.on{background:#58abe6}
.content{width:min(calc(100% - 30px),720px);margin:auto;padding:25px 0}.qcard{background:#fff;border:1px solid var(--line);border-radius:26px;padding:25px 23px 23px;box-shadow:0 10px 26px #2e71931a}.qhead{display:flex;align-items:center;gap:10px}.qnum{background:var(--blue);color:#fff;border-radius:11px;padding:7px 10px;font-size:13px;font-weight:800}.qlabel{color:#a0b0b8;font-size:9px;letter-spacing:1.5px;font-weight:800}.qtext{font-family:'Jua','Noto Sans KR',sans-serif;color:var(--navy);font-size:clamp(25px,7vw,36px);line-height:1.4;margin:17px 0 9px}.help{margin:0;color:#9aadb7;font-size:11px}.answer-title{display:flex;justify-content:space-between;align-items:end;margin:20px 3px 10px}.answer-title strong{font-family:'Jua','Noto Sans KR',sans-serif;font-size:18px}.answer-title span{color:#a3b1b8;font-size:10px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.answer{min-width:0;min-height:138px;border:1px solid var(--line);border-radius:21px;padding:16px;background:#fff;text-align:left;color:#3d6074;cursor:pointer;box-shadow:0 7px 17px #2c709311;display:flex;flex-direction:column}.answer:nth-child(1){background:#fffdf5}.answer:nth-child(2){background:#f8fcff}.answer:nth-child(3){background:#f9fcfa}.answer:nth-child(4){background:#fff9fb}.answer:hover{transform:translateY(-2px)}.anum{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#edf7fd;color:#2187ce;font-size:11px;font-weight:800}.aicon{font-size:27px;line-height:1;margin:11px 0 9px}.atext{font-size:12px;line-height:1.55;font-weight:700;word-break:keep-all}.aarrow{margin-top:auto;text-align:right;color:#b2c2ca;font-size:17px}
/* loading/result */
.loading{display:flex;align-items:center;justify-content:center;padding:25px}.loading-card{width:min(100%,440px);padding:48px 24px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:0 15px 40px #2b719519}.loader{width:78px;height:78px;margin:0 auto 22px;border-radius:50%;border:8px solid #e8f6fd;border-top-color:var(--blue);position:relative}.loader:after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#ff6b6b;right:1px;top:-4px}.eyebrow{margin:0 0 9px;color:#1685df;font-size:9px;font-weight:800;letter-spacing:2px}.loading h1{font-family:'Jua','Noto Sans KR',sans-serif;font-size:25px;line-height:1.45;margin:0 0 12px}.loading p:last-child{font-size:11px;color:#9aaab4}
.result{padding:24px 15px 34px}.result-card{width:min(100%,620px);margin:auto;padding:21px 20px 24px;background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:0 15px 40px #2b719519}.result-top{display:flex;justify-content:space-between}.result-label{color:#1685df;font-size:9px;font-weight:800;letter-spacing:2px}.result-icon{height:205px;display:flex;align-items:center;justify-content:center}.dreambye{max-width:225px;max-height:200px;object-fit:contain}.rkicker{text-align:center;color:#9aabb5;font-size:11px;margin:0 0 7px}.result h1{font-family:'Jua','Noto Sans KR',sans-serif;text-align:center;font-size:34px;margin:0}.tag{width:max-content;max-width:100%;margin:11px auto 15px;padding:8px 14px;border-radius:999px;background:#eef8ff;color:#1685df;font-size:12px;font-weight:800}.desc{background:#fffaf0;border:1px solid #f5eacb;border-radius:18px;padding:15px;text-align:center;color:#667d8b;font-size:12px;line-height:1.7}.points{margin-top:13px;padding:15px;border:1px solid #e4eef3;border-radius:18px}.points-title{font-size:12px;font-weight:800;margin-bottom:7px}.points ul{margin:0;padding-left:18px;color:#708590;font-size:11px;line-height:1.9}.retry{margin-top:18px;width:100%;border:0;border-radius:17px;background:var(--blue);color:#fff;padding:16px;font-weight:800;cursor:pointer}
@media(max-width:700px){.answers{grid-template-columns:1fr;gap:10px}.answer{min-height:92px;padding:14px;display:grid;grid-template-columns:36px 42px 1fr 18px;align-items:center;column-gap:8px}.aicon{margin:0;text-align:center}.atext{font-size:13px}.aarrow{margin:0}.qcard{padding:22px 18px}.qtext{font-size:27px}.content{padding-top:18px}}
</style>
</head>
<body>
<section id="home" class="screen home"><div class="home-card"><img class="poster" src="main-poster.png" alt="테스트 메인 이미지"><div class="home-bottom"><p class="home-copy">나의 생활습관으로 알아보는 기숙사 유형!</p><button id="start" class="start">테스트 시작하기 ›</button><p class="note">총 8문항 · 약 1분</p></div></div></section>
<section id="quiz" class="screen quiz hidden"><header class="header"><button id="back" class="back">←</button><div class="progress"><div class="progress-top"><span>기숙사 생활 스타일 테스트</span><b><span id="num">1</span> / 8</b></div><div id="bars" class="bars"></div></div></header><div class="content"><div class="qcard"><div class="qhead"><div class="qnum">Q. <span id="qnum">01</span></div><div class="qlabel">MY DORM LIFE</div></div><h1 id="qtext" class="qtext"></h1><p class="help">가장 나다운 답변을 골라주세요!</p></div><div class="answer-title"><strong>나의 선택</strong><span>하나만 골라주세요</span></div><div id="answers" class="answers"></div></div></section>
<section id="loading" class="screen loading hidden"><div class="loading-card"><div class="loader"></div><p class="eyebrow">MY DORM STYLE</p><h1>당신의 기숙사 생활 스타일을<br>살펴보고 있어요.</h1><p>답변을 바탕으로 생활 스타일을 정리하는 중이에요!</p></div></section>
<section id="result" class="screen result hidden"><div class="result-card"><div class="result-top"><span class="result-label">MY DORM STYLE</span><span>✦</span></div><div id="resultIcon" class="result-icon"></div><p class="rkicker">당신의 행복기숙사 생활 스타일은</p><h1 id="rtitle"></h1><p id="rtag" class="tag"></p><div id="rdesc" class="desc"></div><div class="points"><div class="points-title">이런 생활을 좋아해요</div><ul id="rpoints"></ul></div><button id="retry" class="retry">다시 테스트하기 ↻</button></div></section>
<script>
const Q=[
['하루 일정을 마치고 기숙사에 돌아왔다. 가장 먼저 하고 싶은 행동은?',[['오늘 해야 할 일을 확인하고 내일 일정을 정리한다.','self'],['친구에게 연락해서 저녁을 같이 먹을지 물어본다.','social'],['가방과 옷을 정리하고 흐트러진 공간부터 정돈한다.','clean'],['침대에 편하게 누워 음악이나 영상을 보며 쉰다.','heal']]],
['주말 아침, 특별한 일정이 없다면?',[['늦잠을 자고 느긋하게 나만의 시간을 보낸다.','heal'],['밀린 빨래나 청소를 하면서 방을 정리한다.','clean'],['친구들과 약속을 잡고 밖에 나갈 계획을 세운다.','social'],['다음 주 일정과 해야 할 일을 미리 정리해둔다.','self']]],
['시험기간에 기숙사 방에서 공부하려고 한다. 가장 먼저 하는 일은?',[['친구에게 같이 공부할지 물어보고 함께할 방법을 찾는다.','social'],['책상 위를 정리하고 공부하기 좋은 환경을 만든다.','clean'],['오늘 공부할 분량과 시간을 정해서 계획을 세운다.','self'],['잠깐 쉬면서 컨디션을 먼저 회복한 뒤 시작한다.','heal']]],
['공용공간을 이용하고 방으로 돌아가기 전, 나는?',[['다음에 사용할 사람을 생각해 사용한 물건을 제자리에 둔다.','clean'],['같이 있던 사람들과 조금 더 이야기를 나눈다.','social'],['오늘 남은 일정이 무엇인지 확인하고 움직인다.','self'],['더 머물러도 괜찮다면 잠깐 쉬면서 여유를 즐긴다.','heal']]],
['하루 종일 바쁘게 움직인 날, 기숙사에 돌아왔을 때 가장 행복한 순간은?',[['오늘 할 일을 모두 끝내고 계획대로 하루를 마무리했을 때','self'],['편안한 침대에 누워 아무 생각 없이 쉴 때','heal'],['친구들과 오늘 있었던 일을 이야기하며 웃을 때','social'],['깨끗하게 정돈된 방에서 편안하게 쉴 때','clean']]],
['기숙사 방에서 물건을 하나 새로 들여놓는다면?',[['공부나 생활을 더 효율적으로 만들어주는 물건','self'],['방을 더 아늑하고 편안하게 만들어주는 물건','heal'],['친구와 함께 사용할 수 있거나 이야깃거리가 되는 물건','social'],['물건을 깔끔하게 정리하고 보관할 수 있는 물건','clean']]],
['갑자기 하루 동안 자유시간이 생겼다면?',[['미뤄둔 공부나 자기계발을 하면서 알차게 보낸다.','self'],['방을 정리하고 필요한 물건들을 정돈한다.','clean'],['친구들과 만나서 맛있는 것을 먹거나 함께 놀러 간다.','social'],['침대에서 푹 쉬거나 좋아하는 콘텐츠를 보며 충전한다.','heal']]],
['행복기숙사에서 나에게 가장 중요한 생활환경은?',[['깔끔하고 정돈된 공간에서 생활할 수 있는 것','clean'],['편하게 쉬면서 나만의 시간을 보낼 수 있는 것','heal'],['공부와 개인 일정을 체계적으로 관리할 수 있는 것','self'],['친구들과 자연스럽게 어울리고 다양한 활동을 할 수 있는 것','social']]]
];
const R={clean:{img:'dreambye-clean.png',title:'깔끔한 정돈러',tag:'“내 공간은 내가 지킨다!”',desc:'정돈된 공간에서 안정감을 느끼는 당신! 주변이 깔끔하게 정리되어 있을 때 생활도 공부도 한결 편안해져요.',p:['물건을 제자리에 두는 편이에요.','쾌적하고 정돈된 환경을 중요하게 생각해요.','공용공간도 다음 사람을 배려하며 사용하는 편이에요.']},heal:{img:'dreambye-heal.png',title:'느긋한 힐링러',tag:'“기숙사는 나의 충전소!”',desc:'바쁜 하루 뒤에는 나만의 속도로 쉬어가는 당신! 편안하고 아늑한 공간에서 충분히 충전하는 시간을 중요하게 생각해요.',p:['혼자만의 편안한 시간을 좋아해요.','무리하지 않고 내 페이스대로 생활하는 편이에요.','아늑하고 편안한 분위기를 선호해요.']},self:{img:'dreambye-self.png',title:'알찬 자기관리러',tag:'“기숙사에서도 나의 루틴은 계속된다!”',desc:'해야 할 일과 쉬는 시간을 알차게 관리하는 당신! 계획을 세우고 하나씩 실천하면서 뿌듯함을 느껴요.',p:['일정과 해야 할 일을 미리 정리하는 편이에요.','공부와 개인 시간을 효율적으로 관리해요.','규칙적인 생활과 나만의 루틴을 중요하게 생각해요.']},social:{img:'dreambye-social.png',title:'활발한 소통러',tag:'“같이하면 기숙사 생활도 두 배로 즐겁다!”',desc:'사람들과 함께할 때 에너지가 생기는 당신! 친구들과 밥을 먹고 이야기를 나누는 등 함께하는 시간을 즐겨요.',p:['친구들과 함께하는 시간을 좋아해요.','새로운 사람과 자연스럽게 어울리는 편이에요.','혼자보다 함께할 때 더 즐거움을 느껴요.']}};
let cur=0,ans=[],score={clean:0,heal:0,self:0,social:0};
const $=id=>document.getElementById(id);function screen(id){['home','quiz','loading','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scrollTo(0,0)}
function draw(){const q=Q[cur];$('qtext').textContent=q[0];$('qnum').textContent=String(cur+1).padStart(2,'0');$('num').textContent=cur+1;$('back').style.visibility=cur?'visible':'hidden';$('bars').innerHTML=Array.from({length:8},(_,i)=>'<i class="'+(i<=cur?'on':'')+'"></i>').join('');
const icons=[
 ['📅','🍽️','🧹','🎧'],
 ['🛏️','🧹','📅','📋'],
 ['👥','🧹','📚','☕'],
 ['📦','💬','📅','🛋️'],
 ['✅','🛏️','💬','🧹'],
 ['💻','🕯️','🎲','🗂️'],
 ['📚','🧹','🍽️','🎧'],
 ['🧹','🛏️','📅','👥']
];
$('answers').innerHTML=q[1].map((a,i)=>'<button class="answer" data-i="'+i+'"><span class="anum">'+(i+1)+'</span><span class="aicon">'+icons[cur][i]+'</span><span class="atext">'+a[0]+'</span><span class="aarrow">›</span></button>').join('');
document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.i)))}
function pick(i){ans[cur]=i;if(cur<Q.length-1){cur++;draw()}else{score={clean:0,heal:0,self:0,social:0};ans.forEach((a,j)=>score[Q[j][1][a][1]]++);screen('loading');setTimeout(result,700)}}
function result(){let key=Object.keys(score).sort((a,b)=>score[b]-score[a])[0],r=R[key];$('resultIcon').innerHTML='<img class="dreambye" src="'+r.img+'" alt="'+r.title+'" onerror="this.style.display=\'none\'">';$('rtitle').textContent=r.title;$('rtag').textContent=r.tag;$('rdesc').textContent=r.desc;$('rpoints').innerHTML=r.p.map(x=>'<li>'+x+'</li>').join('');screen('result')}
$('start').onclick=()=>{cur=0;ans=[];screen('quiz');draw()};$('back').onclick=()=>{if(cur>0){cur--;draw()}};$('retry').onclick=()=>{cur=0;ans=[];screen('quiz');draw()};
</script>
</body></html>
